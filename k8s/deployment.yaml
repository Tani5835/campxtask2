apiVersion: apps/v1
kind: Deployment
metadata:
  name: campxtask
  labels:
    app: campxtask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campxtask
  template:
    metadata:
      labels:
        app: campxtask
    spec:
      containers:
        - name: campxtask
          image: campxtask:6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

